services:
  app:
    build: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PGHOST: db
      PGDATABASE: pediatria
      PGUSER: pediatria
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET}
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pediatria
      POSTGRES_USER: pediatria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pediatria", "-d", "pediatria"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  postgres_data: